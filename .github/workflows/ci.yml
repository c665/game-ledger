name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Start Postgres early; it boots while dependencies install.
      - run: docker compose up -d db
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Waits for the database to be healthy, then applies and verifies every migration.
      - run: npm run db:deploy
      - run: npm test
        env:
          DB_USER: wallet
          DB_PASSWORD: wallet

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=bootstrap init -backend=false
      - run: terraform -chdir=bootstrap validate
      - run: terraform init -backend=false
      - run: terraform validate
